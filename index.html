<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<section class="login-container">
    <div class="img-container">
        <img src="assets/Illustration.svg" alt="">
    </div>
    <div class="cred-container">
        <h2>Welcome to <br> <span >Unstop</span></h2>
        <div class="social-login">
            <button id="googleLogin" class="social-button">Login with Google</button>
            <button id="facebookLogin" class="social-button">Login with Facebook</button>
        </div>
        <form id="loginForm">
            <div class="form-group">
                <input type="text" id="username" placeholder="Username" required>
                <span class="error-message" id="usernameError"></span>
            </div>
            <div class="form-group">
                <input type="email" id="email" placeholder="Email (optional)">
                <span class="error-message" id="emailError"></span>
            </div>
            <div class="form-group">
                <input type="password" id="password" placeholder="Password" required>
                <span class="error-message" id="passwordError"></span>
            </div>
            <div class="form-group">
                <input type="checkbox" id="rememberMe"> Remember Me
            </div>
            <a href="#" id="forgotPassword">Forgot Password?</a>
            <button type="submit">Login</button>
            <p>New user? <a href="#" id="registerLink">Register</a></p>
        </form>
    </div>
</section>
   

    <script src="assets/app.js"></script>
</body>
</html>
